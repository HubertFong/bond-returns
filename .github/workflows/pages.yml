name: Build and deploy

# Fetches the latest US Treasury FedInvest end-of-day prices, runs the Python and
# TypeScript test suites, builds the site and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First price date to try, YYYY-MM-DD (blank = today in New York)"
        required: false
        default: ""
  schedule:
    # Weekdays, after FedInvest publishes (early afternoon New York) and again in the evening.
    - cron: "47 18 * * 1-5"
    - cron: "47 22 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python reference checks
        run: |
          pip install scipy
          python python/bond_returns.py --validate
          python -m unittest discover -s python/tests -v

      - name: Fetch Treasury prices (FedInvest)
        env:
          START_DATE: ${{ inputs.start_date }}
        run: python python/fetch_fedinvest.py --out public/data/treasury_prices.json ${START_DATE:+--start "$START_DATE"}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test the live site
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "$SITE" | grep -q "<title>Bond Returns</title>" && break
            echo "page not live yet, retrying"; sleep 10
          done
          curl -fsS "$SITE" | grep -q "<title>Bond Returns</title>"
          curl -fsS "${SITE}data/treasury_prices.json" -o prices.json
          python3 - <<'EOF'
          import json
          d = json.load(open("prices.json"))
          print("live price file: status=%s price_date=%s securities=%d"
                % (d["status"], d["price_date"], len(d["securities"])))
          if d["status"] != "fresh":
              print("::warning::The live site is not showing fresh FedInvest prices (status: %s)" % d["status"])
          EOF
