name: Build and deploy

# One pipeline for everything: test the maths, fetch the latest US Treasury prices,
# build the page and publish it to GitHub Pages, then check the live site.
#
# What stops a deploy: any failing test, a type error, or a failed build.
# What only warns:     a failed price fetch (the last prices are carried over and the
#                      page shows them as STALE) and a live site without fresh prices.
#
# Run it by hand from the Actions tab ("Run workflow"). The optional start_date makes
# the fetch begin from a chosen day, e.g. a holiday, to check the fallback.
on:
  push:
    branches: [main]
  pull_request:            # tests and build only; nothing is deployed
  workflow_dispatch:
    inputs:
      start_date:
        description: "First price date to try, YYYY-MM-DD (blank = today in New York)"
        required: false
        default: ""
  schedule:
    # Weekdays (UTC): after FedInvest publishes in the early afternoon in New York, and
    # again in the evening. GitHub pauses schedules after 60 days without repo activity.
    - cron: "47 18 * * 1-5"
    - cron: "47 22 * * 1-5"

permissions:              # the minimum Pages deployment needs
  contents: read
  pages: write
  id-token: write

concurrency:              # one deployment at a time; queued runs wait, none are cancelled
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The reference maths (14 checks) and the price-fetch parser tests.
      - name: Python reference checks
        run: |
          pip install scipy
          python python/bond_returns.py --validate
          python -m unittest discover -s python/tests -v

      # Writes public/data/treasury_prices.json. Never fails the build: on error it
      # carries over the deployed file and prints a ::warning:: instead.
      - name: Fetch Treasury prices (FedInvest)
        env:
          START_DATE: ${{ inputs.start_date }}
        run: python python/fetch_fedinvest.py --out public/data/treasury_prices.json ${START_DATE:+--start "$START_DATE"}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test           # 975 tests, incl. the cross-check against the Python reference
      - run: npm run build      # type check (tsc) and production build into dist/

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Load the live page and price file; warn if the prices are not fresh.
      - name: Smoke-test the live site
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "$SITE" | grep -q "<title>Bond Returns</title>" && break
            echo "page not live yet, retrying"; sleep 10
          done
          curl -fsS "$SITE" | grep -q "<title>Bond Returns</title>"
          curl -fsS "${SITE}data/treasury_prices.json" -o prices.json
          python3 - <<'EOF'
          import json
          d = json.load(open("prices.json"))
          print("live price file: status=%s price_date=%s securities=%d"
                % (d["status"], d["price_date"], len(d["securities"])))
          if d["status"] != "fresh":
              print("::warning::The live site is not showing fresh FedInvest prices (status: %s)" % d["status"])
          EOF
